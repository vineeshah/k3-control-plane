- name: Bring up the 3-node cluster
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Build and start the node containers
      ansible.builtin.command: docker compose -f {{ compose_file }} up -d --build
      changed_when: true

    - name: Wait for all three nodes to join
      ansible.builtin.command: k8ctl get nodes --json
      delegate_to: node-0
      register: nodes_out
      changed_when: false
      delay: 3
      retries: 40
      until: nodes_out.rc == 0 and (nodes_out.stdout | from_json | length) == 3

    - name: Deploy the drill workload
      ansible.builtin.include_tasks: tasks/deploy_workload.yml

    - name: Cluster converged
      ansible.builtin.include_tasks: tasks/converged.yml
